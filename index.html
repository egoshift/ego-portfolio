    <style>
      /* The loading globe. Plain HTML and CSS so it paints as soon as this
         file parses — React cannot show anything until ~120KB of JS has
         landed, which is seconds on a slow connection.

         It is the only loading globe: React does not draw a second one, it
         just sets --p on this element as assets arrive and removes it when
         they are all in. Every dot is faintly visible from the start, so the
         sphere reads as present before any progress is known, and brightens
         as the page fills in rather than appearing from nothing. */
      html, body { margin: 0; background: #000; }
      #boot {
        --d: min(62vw, 54vh);
        --n: 220;
        position: fixed; inset: 0; z-index: 9999;
        display: grid; place-items: center;
        background: #000; perspective: 900px;
        transition: opacity .35s ease;
      }
      #boot.out { opacity: 0; }
      #boot .t { width: var(--d); height: var(--d); transform: rotateX(-16deg); transform-style: preserve-3d; }
      #boot .s { width: 100%; height: 100%; position: relative; transform-style: preserve-3d; animation: boot-spin 20s linear infinite; }
      #boot i {
        position: absolute; top: 50%; left: 50%;
        width: calc(var(--s) * 6px); height: calc(var(--s) * 6px);
        margin: calc(var(--s) * -3px) 0 0 calc(var(--s) * -3px);
        border-radius: 50%; background: #00e6ff;
        transform: rotateY(var(--a)) rotateX(var(--b)) translateZ(calc(var(--d) * .34));
        /* dim until this dot's share of the page has arrived, then full */
        opacity: calc(.14 + clamp(0, calc(var(--p, 0) * var(--n) - var(--i)), 1) * .6);
        transition: opacity .25s linear;
      }
      @keyframes boot-spin { to { transform: rotateY(360deg); } }
      @media (prefers-reduced-motion: reduce) { #boot .s { animation: none; } }
