    <style>
      /* Boot sphere. Plain HTML and CSS so it paints as soon as this file
         parses — the React loader cannot appear until ~120KB of JS has
         landed, which is several seconds on a slow connection. Removed by
         the React loader once it takes over. */
      html, body { margin: 0; background: #000; }
      #boot {
        --d: min(62vw, 54vh);
        position: fixed; inset: 0; z-index: 9999;
        display: grid; place-items: center;
        background: #000; perspective: 900px;
        transition: opacity .35s ease;
      }
      #boot.out { opacity: 0; }
      #boot .t { width: var(--d); height: var(--d); transform: rotateX(-16deg); transform-style: preserve-3d; }
      #boot .s { width: 100%; height: 100%; position: relative; transform-style: preserve-3d; animation: boot-spin 20s linear infinite; }
      #boot i {
        position: absolute; top: 50%; left: 50%;
        width: 7px; height: 7px; margin: -3.5px 0 0 -3.5px;
        border-radius: 50%; background: #00e6ff; opacity: 0;
        transform: rotateY(var(--a)) rotateX(var(--b)) translateZ(calc(var(--d) * .34));
        /* staggered so the sphere builds rather than snapping in whole */
        animation: boot-dot .45s linear forwards;
        animation-delay: calc(var(--i) * 55ms);
      }
      @keyframes boot-spin { to { transform: rotateY(360deg); } }
      @keyframes boot-dot { to { opacity: .72; } }
      @media (prefers-reduced-motion: reduce) {
        #boot .s { animation: none; }
        #boot i { animation-duration: .01s; animation-delay: 0s; }
      }
    </style>
  </head>
